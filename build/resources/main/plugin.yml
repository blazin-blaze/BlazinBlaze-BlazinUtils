name: BlazinUtils
version: '1.0'
main: net.blazinblaze.blazinutils.BlazinUtils
api-version: '1.21'
authors: [BlazinBlaze]
description: Utilities for the Blazin Minecraft Server
commands:
  discord:
    description: Sends a link to the Discord Server to the player
    usage: /<command>
  youtube:
    description: Sends a link to the main YouTube to the player
    usage: /<command>
  youtube2:
    description: Sends a link to the 2nd YouTube to the player
    usage: /<command>
  twitch:
    description: Sends a link to Twitch to the player
    usage: /<command>
  servermap:
    description: Sends a link to the server's BlueMap to the player
    usage: /<command>
  serverip:
    description: Sends the server IP to the player
    usage: /<command>
  serverinfo:
    description: Sends a link to the Server Home Page to the player
    usage: /<command>
  servervc:
    description: Sends a link to download Simple Voice Chat
    usage: /<command>
  announcement:
    descrption: Sends an announcement to all players
    usage: /<command>
    permission: blazinutils.op
    permission-message: You are not allowed to run this command.
  announcementchat:
    description: Sends a chat announcement to all players
    usage: /<command>
    permission: blazinutils.op
    permission-message: You are not allowed to run this command.
  purgetoggle:
    description: Toggles a server-wide purge
    usage: /<command>
    permission: blazinutils.op
    permission-message: You are not allowed to run this command.
  purgetimed:
    description: Starts a timed server-wide purge
    usage: /<command>
    permission: blazinutils.op
    permission-message: You are not allowed to run this command.
  playtimeboard:
    description: Shows the top 10 highest play-time players
    usage: /<command>
  playtimeuser:
    description: Shows the play-time of the specified player
    usage: /<command>
  tpspawn:
    description: TP to spawn during events
    usage: /<command>
  tpreturn:
    description: TP to return from events
    usage: /<command>
  spawneventtoggle:
    description: Toggle spawn events
    usage: /<command>
    permission: blazinutils.op
    permission-message: You are not allowed to run this command.
permissions:
  blazinutils.op:
    description: Permission for op commands
    default: op